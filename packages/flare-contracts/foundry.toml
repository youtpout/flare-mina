[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../shared/fixtures" }]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
flare = "https://flare-api.flare.network/ext/C/rpc"
