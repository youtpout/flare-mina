<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two interlocking rings: one per chain, in the palette the header uses.
       Rings rather than a glyph because letterforms turn to mush at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <g fill="none" stroke-width="3.4">
    <circle cx="12.4" cy="16" r="6.4" stroke="#ff9a3c"/>
    <circle cx="19.6" cy="16" r="6.4" stroke="#e6357a"/>
  </g>
  <!-- The crossing, drawn last so the Mina ring reads as passing in front. -->
  <path d="M14.6 10.6a6.4 6.4 0 0 0 0 10.8" fill="none" stroke="#ff9a3c" stroke-width="3.4"/>
</svg>
