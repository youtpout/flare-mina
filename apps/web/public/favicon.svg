<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A bridge: a span over two piers, Mina orange on the left bank running to
       Flare pink on the right. Two thick shapes and nothing else, because a
       favicon is read at 16px where fine detail turns to grey mush. -->
  <defs>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#e6357a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <g stroke="url(#span)" stroke-width="3.2" fill="none" stroke-linecap="round">
    <!-- The deck, and the arch carrying it. -->
    <path d="M4.5 20.5h23"/>
    <path d="M6.5 20.5a9.5 9.5 0 0 1 19 0"/>
    <!-- Piers, short enough to read as thickness rather than as legs. -->
    <path d="M10.6 20.5v5.2M21.4 20.5v5.2"/>
  </g>
</svg>
